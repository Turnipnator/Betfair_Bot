version: '3.8'

services:
  betfair-bot:
    build: .
    container_name: betfair-bot
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      # Persist data and logs
      - ./data:/app/data
      # SSL certificates (read-only for security)
      - ./certs:/app/certs:ro
      # Nags horse racing bot's SQLite (read-only) — VPS-only path.
      # Whole directory mounted because SQLite WAL mode requires
      # .db-shm and .db-wal files alongside racing.db.
      - /root/horse-racing-bot/data:/app/nags-data:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Advisory football accumulators (src/acca). Places no bets: prices from
  # the Exchange, alerts to its own Telegram bot, ledger in data/acca.db.
  # Deploy it alone so the live bot keeps running:
  #   docker compose up -d --build acca-advisor
  acca-advisor:
    build: .
    container_name: acca-advisor
    restart: unless-stopped
    network_mode: host
    command: ["python", "scripts/run_acca_advisor.py"]
    env_file:
      - .env
    environment:
      LOG_FILE: data/logs/acca.log
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck_acca.py"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL for production use
  postgres:
    image: postgres:15-alpine
    container_name: betfair-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: betfair
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: betfair_bot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - betfair-network
    profiles:
      - production

networks:
  betfair-network:
    driver: bridge

volumes:
  postgres-data:
